[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plasmidtools"
version = "0.1.0"
description = "Tools for plasmid analysis in MPRA experiments"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"

dependencies = [
    # ── fill in from parse_deps.py output ──────────────────
    "adjustText>=1.3.0",
    "aiohttp>=3.11.16",
    "beautifulsoup4>=4.13.3",
    "biopython>=1.87",
    "h5py>=3.13.0",
    "logomaker>=0.8.7",
    "mappy>=2.29",
    "matplotlib>=3.10.1",
    "networkx>=3.4.2",
    "numpy>=2.0.1",
    "pillow>=11.1.0",
    "polars-lts-cpu>=1.33.1",
    "pydivsufsort>=0.0.20",
    "python-dotenv>=1.2.2",
    "requests>=2.32.3",
    "scikit-learn>=1.6.1",
    "scipy>=1.16.0",
    "seaborn>=0.13.2",
    "torch>=2.3.1",
    "tqdm>=4.67.1",
    "urllib3>=2.3.0",
    # ───────────────────────────────────────────────────────
]

[project.optional-dependencies]
dev = [
    "jupyter",
    "jupyterlab",
    "ipykernel",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["plasmidtools*"]
